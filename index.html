  if (grid) {
    grid.innerHTML = SITE_TEXT.GAMES
      .map(game => `<div class="game-home-item">${game}</div>`)
      .join("");
  }

  const lineBtn = document.getElementById("lineContactBtn");
  if (lineBtn) lineBtn.href = SITE_TEXT.LINE_URL;
}
document.addEventListener("DOMContentLoaded", applySiteText);

function openContact(){
  document.getElementById('contactModal').classList.add('show');
}
function closeContact(){
  document.getElementById('contactModal').classList.remove('show');
}

</script>

</body>
